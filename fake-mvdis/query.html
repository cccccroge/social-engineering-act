<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-TW">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>網路安全提醒 - 社交工程演練</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Microsoft JhengHei', Arial, sans-serif;
        background: url('./images/query_bg.jpg') center center / cover no-repeat;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      /* Background symbols */
      .bg-symbols {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.1;
        z-index: 1;
      }

      .symbol {
        position: absolute;
        animation: float 6s ease-in-out infinite;
      }

      .symbol:nth-child(even) {
        animation-delay: -3s;
        animation-direction: reverse;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
      }

      /* Main content */
      .container {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        padding: 40px 15px 20px 15px;
        background: rgba(0, 0, 0, 0.4);
      }

      @media (min-width: 768px) {
        .container {
          padding: 60px 40px 40px 40px;
        }
      }

      .warning-box {
        max-width: 100%;
        text-align: center;
      }

      .alert-icon {
        font-size: 60px;
        margin-bottom: 15px;
        animation: pulse 2s infinite;
      }

      @media (min-width: 768px) {
        .alert-icon {
          font-size: 80px;
          margin-bottom: 20px;
        }
      }

      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }

      .main-title {
        color: #ffffff;
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 25px;
        line-height: 1.2;
      }

      .sub-title {
        color: #ffffff;
        font-size: 22px;
        margin-bottom: 30px;
        line-height: 1.4;
        text-shadow: 0 0 8px rgba(255, 255, 255, 0.6), 2px 2px 4px rgba(0, 0, 0, 0.8);
      }

      .reminder-text {
        color: #f0f0f0;
        font-size: 18px;
        margin-bottom: 25px;
        line-height: 1.5;
      }

      @media (min-width: 768px) {
        .main-title {
          font-size: 38px;
          margin-bottom: 30px;
        }

        .sub-title {
          font-size: 26px;
          margin-bottom: 35px;
          text-shadow: 0 0 12px rgba(255, 255, 255, 0.7), 3px 3px 6px rgba(0, 0, 0, 0.8);
        }

        .reminder-text {
          font-size: 20px;
          margin-bottom: 30px;
        }
      }

      .warning-list {
        background: rgba(0, 0, 0, 0.3);
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 15px;
        padding: 20px;
        margin: 25px 0;
        text-align: left;
        backdrop-filter: blur(5px);
      }

      .warning-list h3 {
        color: #ffffff;
        font-size: 22px;
        margin-bottom: 18px;
        text-align: center;
        line-height: 1.3;
      }

      .warning-list ul {
        list-style: none;
        padding: 0;
      }

      .warning-list li {
        color: #ffffff;
        font-size: 16px;
        margin-bottom: 15px;
        padding-left: 35px;
        position: relative;
        line-height: 1.5;
      }

      .warning-list li::before {
        content: "⚠️ ";
        position: absolute;
        left: 0;
        top: 0;
        font-size: 2rem;
      }

      @media (min-width: 768px) {
        .warning-list {
          padding: 30px;
          margin: 30px 0;
        }

        .warning-list h3 {
          font-size: 26px;
          margin-bottom: 20px;
        }

        .warning-list li {
          font-size: 18px;
          margin-bottom: 12px;
        }
      }

      .final-message {
        background: linear-gradient(45deg, rgba(76, 175, 80, 0.8), rgba(69, 160, 73, 0.8));
        color: #ffffff;
        padding: 20px;
        border-radius: 15px;
        font-size: 18px;
        font-weight: bold;
        margin-top: 25px;
        line-height: 1.4;
        border: 2px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(5px);
      }

      .shield-icon {
        display: inline-block;
        margin: 0 8px;
        font-size: 22px;
      }

      .big-exclamation {
        font-size: 1.4em;
        color: #ff4444;
        font-weight: bold;
      }

      @media (min-width: 768px) {
        .final-message {
          padding: 25px;
          font-size: 20px;
          margin-top: 30px;
        }

        .shield-icon {
          margin: 0 10px;
          font-size: 26px;
        }

        .big-exclamation {
          font-size: 1.5em;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background symbols -->
    <div class="bg-symbols">
      <!-- Devil/demon SVGs -->
      <svg class="symbol" style="top: 10%; left: 10%; width: 60px; height: 60px;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L8 8H4L8 12L4 16H8L12 22L16 16H20L16 12L20 8H16L12 2Z"/>
      </svg>

      <svg class="symbol" style="top: 20%; right: 15%; width: 50px; height: 50px;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2L8 8H4L8 12L4 16H8L12 22L16 16H20L16 12L20 8H16L12 2Z"/>
      </svg>

      <!-- Money symbols -->
      <svg class="symbol" style="top: 60%; left: 5%; width: 70px; height: 70px;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2M21 9V7L12 2L3 7V9C3 10.1 3.9 11 5 11V13C3.9 13 3 13.9 3 15V17C3 18.1 3.9 19 5 19V21C5 22.1 5.9 23 7 23H17C18.1 23 19 22.1 19 21V19C20.1 19 21 18.1 21 17V15C21 13.9 20.1 13 19 13V11C20.1 11 21 10.1 21 9M12 7C14.76 7 17 9.24 17 12S14.76 17 12 17S7 14.76 7 12S9.24 7 12 7M12 9C10.34 9 9 10.34 9 12S10.34 15 12 15S15 13.66 15 12S13.66 9 12 9Z"/>
      </svg>

      <svg class="symbol" style="bottom: 20%; right: 10%; width: 55px; height: 55px;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7,15H9C9,16.08 10.37,17 12,17C13.63,17 15,16.08 15,15C15,13.9 13.96,13.5 11.76,12.97C9.64,12.44 7,11.78 7,9C7,7.21 8.47,5.69 10.5,5.18V3H13.5V5.18C15.53,5.69 17,7.21 17,9H15C15,7.92 13.63,7 12,7C10.37,7 9,7.92 9,9C9,10.1 10.04,10.5 12.24,11.03C14.36,11.56 17,12.22 17,15C17,16.79 15.53,18.31 13.5,18.82V21H10.5V18.82C8.47,18.31 7,16.79 7,15Z"/>
      </svg>

      <svg class="symbol" style="top: 40%; left: 80%; width: 45px; height: 45px;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5,6H23V18H5V6M14,9A3,3 0 0,1 17,12A3,3 0 0,1 14,15A3,3 0 0,1 11,12A3,3 0 0,1 14,9M9,8A2,2 0 0,1 7,10V14A2,2 0 0,1 9,16H19A2,2 0 0,1 21,14V10A2,2 0 0,1 19,8H9Z"/>
      </svg>

      <!-- Warning symbols -->
      <svg class="symbol" style="bottom: 40%; left: 20%; width: 40px; height: 40px;" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16"/>
      </svg>
    </div>

    <div class="container">
      <div class="warning-box">
        <div class="alert-icon">🚨</div>

        <h1 class="main-title">網路安全提醒：這是一個社交工程演練<span class="big-exclamation">！</span></h1>

        <p class="sub-title">
          <strong>恭喜你發現了這個秘密<span class="big-exclamation">！</span></strong><br>
          你之所以會看到這則公告，是因為你點擊了我們設計的測試連結。
        </p>

        <div class="warning-list">
          <h3>🛡️ 重要安全提醒 🛡️</h3>
          <ul>
            <li><strong>不要隨意點擊不明網頁連結</strong><br>
                詐騙分子經常透過假冒的政府網站或銀行網站來騙取個人資料</li>
            <li><strong>不要輕易填寫個人資料</strong><br>
                身分證字號、銀行帳號、密碼等敏感資訊絕不應在可疑網站上輸入</li>
            <li><strong>不要隨意進行匯款</strong><br>
                任何要求立即匯款或轉帳的訊息都應該再三確認</li>
          </ul>
        </div>

        <p class="reminder-text">
          <strong>這些都是詐騙集團常用的手法。</strong><br>
          請隨時保持警覺，保護你的個人資訊和財產安全<span class="big-exclamation">！</span>
        </p>

        <div class="final-message">
          <span class="shield-icon">🛡️</span>
          <strong>保護自己，從你我做起</strong>
          <span class="shield-icon">🛡️</span>
        </div>
      </div>
    </div>
  </body>
</html>
